version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fraudguard-db
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=FraudGuard2026_! # Senin şifrenle güncelledik
      - MSSQL_DATABASE=FraudGuard
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  # 2. .NET Web API Servisi
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: fraudguard-backend
    ports:
      - "5217:8080"
    environment:
      # Veritabanı adı FraudGuard ve şifre FraudGuard2026_! olarak güncellendi
      - ConnectionStrings__DefaultConnection=Server=db;Database=FraudGuard;User Id=sa;Password=FraudGuard2026_!;TrustServerCertificate=True;
      - ConnectionStrings__RedisConnection=redis:6379
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
      - redis

  # 2.5. Redis Önbellek Servisi
  redis:
    image: redis:alpine
    container_name: fraudguard-redis
    ports:
      - "6379:6379"

  # 3. React Frontend Servisi
  frontend:
    build:
      context: ./Client/react-ui
      dockerfile: Dockerfile
    container_name: fraudguard-frontend
    ports:
      - "3000:80" # Konteyner içindeki 80 (Nginx) portunu dışarıya 3000 olarak açıyoruz
    depends_on:
      - backend

  # 4. Transaction Simulator Servisi
  simulator:
    build:
      context: ./TransactionSimulator
      dockerfile: Dockerfile
    container_name: fraudguard-simulator
    ports:
      - "4000:4000"
    environment:
      - API_HOST=backend
      - API_PORT=8080
    depends_on:
      - backend

volumes:
  mssql-data: # Veritabanının konteyner kapandığında silinmemesi için kalıcı disk alanı
